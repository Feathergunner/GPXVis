{% block content %}
<div class="cleanpanel">
<div class="divrow">
	<div class="panel floating">
		<div id="map"></div>
	</div>
	<div class="panel floating">
		<h3>Map Settings</h3>
		<p id="coords">
			<label>Latitude:</label>
			<input id="inputLatitude" type="Number" step="any", onchange="updateLatLon()"><br><br>
			<label>Longitude:</label>
			<input id="inputLongitude" type="Number" step="any", onchange="updateLatLon()">
		</p>
		<p>Map detail level:</p>
		<input type="number" id="zoom", value="8" onchange="onZoomInputChange(this.value)">
		<br>
		<p>Maximum distance of start from selected position (km):</p>
		<input type="number" id="activity_range_selection", value="5">
	</div>
</div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/mapHandler.js') }}" defer></script>
{% endblock %}
