{% block content %}

<div class="panel floating">
	<label for="activitytype_select">Select activity type:</label>
	<select id="activitytype_select">
		{% for activitytype in recordtypes %}
			<option value="{{ activitytype }}">{{ activitytype }}</option>
		{% endfor %}
	</select>

	<label for="recordtype_select">Select record type:</label>
	<select id="recordtype_select">
		<!-- Filled by JavaScript -->
	</select>
	<br>
	Number of rows: <input id="rowLimitSetter" type=Number value=20>

	<!-- Table -->
	<table id="tableRecords">
		<thead id="tableRecordsHead">
		</thead>
	
		<tbody id="tableRecordsBody">
			<!-- Filled by JavaScript -->
		</tbody>
	</table>
</div>

{% endblock %}
	
{% block scripts %}
<script>
    const recordtypes = {{ recordtypes | tojson }};
    const recorddata = {{ recorddata | tojson }};
</script>

<script src="{{ url_for('static', filename='js/record_table.js') }}" defer></script>
{% endblock %}
