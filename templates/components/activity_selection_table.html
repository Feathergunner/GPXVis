{% macro activity_selection_table(considergps, addselectioncheckbox, defaultchecked) %}
<div class="cleanpanel" id="activity_selection_table">
	<button onclick="getActivities({{ considergps }}, {{ addselectioncheckbox }}, {{ defaultchecked }})">Show relevant activities</button>

	<h3>Select Activities:</h3>
	{% include "components/activity_table.html" %}

	<button onclick="selectAllActivities(true)"> Select all activities </button>
	<button onclick="selectAllActivities(false)"> Deselect all activities </button>
</div>
{% endmacro %}
